name: Zainaer Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10.28.0
          package_json_file: frontend/package.json
      - run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py' -v
      - name: Verify online backup and recovery logic
        run: |
          python3 -m venv "$RUNNER_TEMP/backup-tests"
          "$RUNNER_TEMP/backup-tests/bin/pip" install -r scripts/backup/requirements.txt
          "$RUNNER_TEMP/backup-tests/bin/python" -m unittest discover -s scripts/backup -p 'test_*.py' -v
      - run: go test ./app/api/handlers/v1 ./app/api ./internal/core/services ./internal/sys/wechat ./internal/sys/config -count=1
        working-directory: backend
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify mini program and shared client
        run: |
          node miniprogram/scripts/build.cjs
          node --test miniprogram/tests/*.test.cjs
          node frontend/node_modules/typescript/bin/tsc --strict --noEmit --skipLibCheck --target ES2020 --moduleResolution bundler --module esnext shared/transport.typecheck.ts
      - name: Build release executable
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          HOUSEHOLD_BUILD_OUTPUT: ${{ runner.temp }}/zainaer
        run: sh scripts/build-household.sh
      - name: Package executable, checksums and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gzip -n -c "$RUNNER_TEMP/zainaer" > dist/zainaer-linux-amd64.gz
          sha256sum "$RUNNER_TEMP/zainaer" | cut -d ' ' -f1 > dist/BINARY_SHA256
          printf '{"version":"%s","commit":"%s"}\n' "$(cat VERSION)" "$(git rev-parse HEAD)" > dist/release.json
          git archive --format=tar.gz --prefix=zainaer/ -o dist/zainaer-source.tar.gz HEAD
          cp LICENSE LICENSE-MIT LICENSING.md dist/
          (cd dist && sha256sum zainaer-linux-amd64.gz BINARY_SHA256 release.json zainaer-source.tar.gz LICENSE LICENSE-MIT LICENSING.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A rerun never silently replaces an already published release.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Zainaer $GITHUB_REF_NAME" --notes "Linux amd64 executable with embedded frontend, checksums, and matching AGPL source. Production deployment is manual through the Zainaer Deploy workflow."
