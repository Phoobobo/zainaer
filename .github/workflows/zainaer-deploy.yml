name: Zainaer Deploy
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, for example v0.1.5'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zainaer-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and validate the selected Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > "$RUNNER_TEMP/release-state.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert not r["isDraft"] and not r["isPrerelease"]' "$RUNNER_TEMP/release-state.json"
          mkdir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'zainaer-linux-amd64.gz' --pattern 'BINARY_SHA256' --pattern 'release.json' --pattern 'SHA256SUMS'
          python3 scripts/deploy/verify_release.py "$RELEASE_TAG"
      - name: Deploy with server-side backup and rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$keydir/known_hosts"
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -s "$keydir/key"
          python3 scripts/deploy/send.py | ssh -T -i "$keydir/key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 "$DEPLOY_USER@$DEPLOY_HOST" deploy
          echo '### Production deployment succeeded' >> "$GITHUB_STEP_SUMMARY"
          cat dist/release.json >> "$GITHUB_STEP_SUMMARY"
